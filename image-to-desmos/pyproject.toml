[project]
name = "image-to-desmos"
version = "0.1.0"
description = "Convert rough graph images into shareable Desmos graphs via Claude vision."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2",
  "python-dotenv>=1",
]

[project.scripts]
image-to-desmos = "image_to_desmos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
